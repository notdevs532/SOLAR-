
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SOLAR | Explore the Planets</title>
    <link rel="stylesheet" href="style.css">
    <script src="solar.js" defer></script>
</head>

<body>

    <section id="solarPlanet">

        <h1>EXPLORE THE SOLAR SYSTEM</h1>
        <p>Click a planet to discover more.</p>

        <div class="planets">
            <h2 onclick="showPlanet('Mercury')">MERCURY</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Venus')">VENUS</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Earth')">EARTH</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Mars')">MARS</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Jupiter')">JUPITER</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Saturn')">SATURN</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Uranus')">URANUS</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Neptune')">NEPTUNE</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Pluto')">PLUTO</h2>
        </div>

        <div class="planet">
            <h2 onclick="showPlanet('Eris')">ERIS</h2>
        </div>


        <div class="planet">
            <h2 onclick="showPlanet('Orcus')">ORCUS</h2>
        </div>


        <div class="planet">
            <h2 onclick="showPlanet('2002 MS4')">2002 MS4</h2>
        </div>


        <div class="planet">
            <h2 onclick="showPlanet('Quaoar')">QUAOAR</h2>
        </div>

          <div class="planet">
            <h2 onclick="showPlanet('Gonggong')">GONGGONG</h2>
        </div>

          <div class="planet">
            <h2 onclick="showPlanet('Sedna')">SEDNA</h2>
        </div>


        <div id="planetInfo">
            <h2 id="planetName">WELCOME TO ORBIT</h2>
            <p id="planetDescription">
                Select a planet above to explore it.
            </p>
            <p id="planetMoons"></p>
        </div>

    </section>

</body>
</html>
